[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfe-importer"
version = "0.1.0"
description = "Django REST API that imports, validates and reports on Brazilian NF-e XML invoices"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Davi Fraga" }]
requires-python = ">=3.12"
dependencies = [
    "Django>=6.0,<6.2",
    "djangorestframework>=3.16",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
mysql = ["mysqlclient>=2.2.1"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "pytest-django>=4.9", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["config*", "invoices*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["invoices/tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["invoices/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ"]

[tool.ruff.lint.per-file-ignores]
"invoices/tests/*" = ["E501"]
